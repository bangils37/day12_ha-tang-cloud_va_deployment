version: '3.8'

services:
  agent:
    build: .
    environment:
      - PORT=8000
      - REDIS_URL=redis://redis:6379/0
      - AGENT_API_KEY=my-secret-key
      - LOG_LEVEL=INFO
      - RATE_LIMIT_PER_MINUTE=10
      - MONTHLY_BUDGET_USD=10.0
    depends_on:
      - redis
    networks:
      - agent-network

  redis:
    image: redis:alpine
    volumes:
      - redis-data:/data
    networks:
      - agent-network

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - agent
    networks:
      - agent-network

volumes:
  redis-data:

networks:
  agent-network:
